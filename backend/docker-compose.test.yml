services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-test
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_test_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_test_data:
